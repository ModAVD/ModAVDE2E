name: Static checks

# 只做静态检查：实跑要模拟器、显卡和游戏，在维护者和平台负责人自己的测试机上跑（见 README）。
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout ModAVD for its privacy scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModAVD/ModAVD
          path: .modavd
          persist-credentials: false
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -File -Include *.ps1, *.psd1 | Where-Object { $_.FullName -notmatch '[\\/]\.modavd[\\/]' } | ForEach-Object {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Compile the Python helpers
        run: python3 -m py_compile items/maayys_run.py
      - name: Check disk usage parsing and install safeguards
        shell: pwsh
        run: ./tests/created-disk-usage.ps1
      - name: Check the manager requirement, port_base check and game port guard
        shell: pwsh
        run: ./tests/tooling-guards.ps1
      - name: Check how the r1999 item judges the M9A driver
        shell: pwsh
        run: ./tests/m9a-verdict.ps1
      - name: Check that test roots are existing roots and never the production root
        shell: pwsh
        run: ./tests/root-guards.ps1
      - name: Check that pointing a test root at the SDK under test is undone byte for byte
        shell: pwsh
        run: ./tests/root-sdk.ps1
      - name: Check the fetch item with and without the old batch file, and that it keeps LOCALAPPDATA private
        shell: pwsh
        run: ./tests/fetch-item.ps1
      - name: Check the dataverify item pattern, plan and mismatch reporting against a fake guest
        shell: pwsh
        run: ./tests/dataverify.ps1
      - name: Scan tracked files for private identity and paths
        run: python3 .modavd/scripts/privacy.py .

  authors:
    name: Commit authors and trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Empty outside pull_request: the script then checks origin/main..HEAD.
      REPO_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      REPO_CHECK_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
    steps:
      - name: Checkout full history without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run repo checks unit tests
        run: python3 -B -I -X utf8 scripts/test_repo_checks.py -v
      # PR 里的提交在 pull_request 时已经查过。push 和 merge_group 下要查的只剩 GitHub 生成的 squash 提交，
      # 它的作者邮箱取自贡献者 GitHub 账号的设置，不归作者检查管；查了会让合并队列和 main 无端变红。
      - name: Check commit authors and trailers
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 -B -I -X utf8 scripts/repo_checks.py

  shared-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout ModAVD for the shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModAVD/ModAVD
          ref: main
          path: .modavd
          persist-credentials: false
          sparse-checkout: |
            scripts/repo_checks.py
            scripts/test_repo_checks.py
          sparse-checkout-cone-mode: false
      - name: Shared scripts are ModAVD's
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/repo_checks.py scripts/test_repo_checks.py; do
            if ! cmp -s "$f" ".modavd/$f"; then
              echo "::error file=$f::$f differs from ModAVD/ModAVD main. These scripts are changed in ModAVD first; copy its $f here byte for byte."
              exit 1
            fi
          done
          echo "repo_checks.py and test_repo_checks.py are the same as ModAVD/ModAVD main $(git -C .modavd rev-parse --short HEAD)"

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.32.0 (version and wheel hash pinned)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          printf '%s\n' 'zizmor==1.32.0 --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071' > "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor-requirements.txt"
      - name: Audit workflows and Dependabot config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --no-progress .'
