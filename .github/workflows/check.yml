name: Static checks

# 只做静态检查：实跑要模拟器、显卡和游戏，在维护者和平台负责人自己的测试机上跑（见 README）。
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout ModAVD for its privacy scanner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ModAVD/ModAVD
          path: .modavd
          persist-credentials: false
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -File -Include *.ps1, *.psd1 | Where-Object { $_.FullName -notmatch '[\\/]\.modavd[\\/]' } | ForEach-Object {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Compile the Python helpers
        run: python3 -m py_compile items/maayys_run.py
      - name: Check disk usage parsing and install safeguards
        shell: pwsh
        run: ./tests/created-disk-usage.ps1
      - name: Check the manager requirement, port_base check and game port guard
        shell: pwsh
        run: ./tests/tooling-guards.ps1
      - name: Check how the r1999 item judges the M9A driver
        shell: pwsh
        run: ./tests/m9a-verdict.ps1
      - name: Check that test roots are existing roots and never the production root
        shell: pwsh
        run: ./tests/root-guards.ps1
      - name: Check that pointing a test root at the SDK under test is undone byte for byte
        shell: pwsh
        run: ./tests/root-sdk.ps1
      - name: Check the fetch item with and without the old batch file, and that it keeps LOCALAPPDATA private
        shell: pwsh
        run: ./tests/fetch-item.ps1
      - name: Scan tracked files for private identity and paths
        run: python3 .modavd/scripts/privacy.py .

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install zizmor 1.32.0 (version and wheel hash pinned)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          printf '%s\n' 'zizmor==1.32.0 --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071' > "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor-requirements.txt"
      - name: Audit workflows and Dependabot config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --no-progress .'
